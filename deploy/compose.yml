services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_APP_URL: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
    image: toxichr:production
    restart: unless-stopped
    init: true
    env_file: ${TOXICHR_ENV_FILE:?Set TOXICHR_ENV_FILE}
    volumes:
      - ${TOXICHR_DATA_DIR:?Set TOXICHR_DATA_DIR}:/app/.data
      - ${TOXICHR_BACKUP_DIR:?Set TOXICHR_BACKUP_DIR}:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
