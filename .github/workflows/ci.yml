name: Проверка ToxicHR
run-name: "ToxicHR · ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'quick' }} · ${{ github.ref_name }}"

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "full — финал спринта; иначе только выбранный контур"
        type: choice
        required: true
        default: full
        options:
          - full
          - quick
          - safety
          - persona
          - vacancy
          - monetization
          - e2e

# Новый push отменяет устаревшую быструю проверку той же ветки.
# Ручные проверки имеют отдельную группу и не прерываются новым push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  DATABASE_URL: file:/tmp/toxichr-ci.db
  AUTH_SECRET: ci-only-secret
  AI_PROVIDER: mock
  NEXT_PUBLIC_APP_URL: http://localhost:3100

# Режим CI:
# - любой обычный push/PR во время разработки: быстрые guardrails (lint + typecheck);
# - ручной suite=full: полный acceptance на финальном commit спринта;
# - ручной выбор контура: точечная диагностика, не полная приёмка.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  safety:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'safety')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:safety

  persona:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'persona')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:persona

  vacancy:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'vacancy')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:vacancy

  monetization:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'monetization')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:monetization

  e2e:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
